version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: steadylearn-db
    environment:
      POSTGRES_USER: steadylearn
      POSTGRES_PASSWORD: SteadyLearn@123
      POSTGRES_DB: steadylearn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steadylearn -d steadylearn"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - steadylearn-network

volumes:
  postgres_data:
    driver: local

networks:
  steadylearn-network:
    driver: bridge
